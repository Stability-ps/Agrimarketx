<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E7D32" />
    <title>AgriMarketX offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        color: #0f172a;
        background: #ffffff;
      }
      main {
        max-width: 420px;
        border: 1px solid #dbe4ee;
        border-radius: 12px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 180px;
        max-width: 100%;
        height: auto;
      }
      h1 {
        font-size: 24px;
        margin: 20px 0 8px;
      }
      p {
        color: #475569;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        border-radius: 8px;
        background: #2E7D32;
        color: white;
        padding: 10px 16px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/agrimarketx-logo.png" alt="AgriMarketX" />
      <h1>You are offline</h1>
      <p>AgriMarketX needs an internet connection for live marketplace data, Supabase login, verification and uploads.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
